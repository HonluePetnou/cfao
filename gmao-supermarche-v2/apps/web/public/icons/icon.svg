<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#060537"/>
  
  <!-- Orange accent circle -->
  <circle cx="256" cy="256" r="180" fill="#0A0E5C"/>
  
  <!-- Wrench icon (lucide-style) centered -->
  <g transform="translate(130, 130) scale(1.04)" fill="none" stroke="#FA5B07" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench head -->
    <path d="M 220 40 
             A 80 80 0 0 0 80 180 
             L 20 240 
             A 30 30 0 0 0 20 282 
             L 58 320 
             A 30 30 0 0 0 100 320 
             L 160 260 
             A 80 80 0 0 0 300 120 
             L 260 160 
             L 200 100 Z"/>
    <!-- Dots on wrench head -->
    <circle cx="100" cy="148" r="12" fill="#FA5B07" stroke="none"/>
  </g>
  
  <!-- "GMAO" text -->
  <text x="256" y="420" 
        font-family="Arial, sans-serif" 
        font-size="56" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#FA5B07"
        letter-spacing="6">GMAO</text>
</svg>
